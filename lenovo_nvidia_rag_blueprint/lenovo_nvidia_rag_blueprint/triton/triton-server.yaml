# ============================================================================
# Triton Inference Server — Standalone K8s Deployment
# ============================================================================
# Lenovo ThinkSystem SR650a V4 - GPU Inference Server
#
# Deploys NVIDIA Triton Inference Server 26.03 for general-purpose ML inference
# (image recognition, object detection, custom models, etc.).
#
# GPU: Shares the 2g.48gb MIG slice on GPU 1 via 3x CUDA time-slicing
#      alongside OCR NIM and Page Elements NIM.
#
# Pre-loaded models (via initContainer):
#   - densenet_onnx: DenseNet-121 image classification (1000 ImageNet classes)
#     Official Triton quickstart model:
#     https://github.com/triton-inference-server/server/blob/main/docs/getting_started/quickstart.md
#   Additional models can be added to the PVC at /models/<model_name>/
#
# Ports:
#   8000 — HTTP/REST inference API (KServe V2 / Triton)
#   8001 — gRPC inference API
#   8002 — Prometheus metrics + health endpoints
#
# Namespace: triton (separate from RAG Blueprint)
# ============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triton-model-repo
  labels:
    app: triton-inference-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-inference-server
  labels:
    app: triton-inference-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-inference-server
  template:
    metadata:
      labels:
        app: triton-inference-server
    spec:
      imagePullSecrets:
        - name: ngc-secret
      initContainers:
        # Download sample models into the PVC before Triton starts.
        # Runs only if models are not already present (idempotent).
        #
        # Note: The official Triton K8s tutorials use either a temporary
        # setup pod with NFS (Deployment/Kubernetes/) or fetch_models.sh
        # on the host. For densenet_onnx the fetch script is just a single
        # wget, so an initContainer achieves the same result without
        # requiring manual steps or NFS infrastructure.
        - name: model-loader
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # densenet_onnx — DenseNet-121 image classification (ONNX)
              # Official Triton quickstart model:
              # https://github.com/triton-inference-server/server/blob/main/docs/getting_started/quickstart.md
              MODEL_DIR="/models/densenet_onnx"
              if [ -f "${MODEL_DIR}/1/model.onnx" ]; then
                echo "densenet_onnx already present — skipping download."
              else
                echo "Downloading densenet_onnx model..."
                mkdir -p "${MODEL_DIR}/1"
                wget -q -O "${MODEL_DIR}/1/model.onnx" \
                  "https://github.com/onnx/models/raw/main/validated/vision/classification/densenet-121/model/densenet-7.onnx"
                # Download class labels (1000 ImageNet classes)
                wget -q -O "${MODEL_DIR}/densenet_labels.txt" \
                  "https://raw.githubusercontent.com/triton-inference-server/server/main/docs/examples/model_repository/densenet_onnx/densenet_labels.txt"
                # Create model config — matches upstream exactly:
                # https://github.com/triton-inference-server/server/blob/main/docs/examples/model_repository/densenet_onnx/config.pbtxt
                cat > "${MODEL_DIR}/config.pbtxt" <<'CONFIG'
              name: "densenet_onnx"
              platform: "onnxruntime_onnx"
              max_batch_size : 0
              input [
                {
                  name: "data_0"
                  data_type: TYPE_FP32
                  format: FORMAT_NCHW
                  dims: [ 3, 224, 224 ]
                  reshape { shape: [ 1, 3, 224, 224 ] }
                }
              ]
              output [
                {
                  name: "fc6_1"
                  data_type: TYPE_FP32
                  dims: [ 1000 ]
                  reshape { shape: [ 1, 1000, 1, 1 ] }
                  label_filename: "densenet_labels.txt"
                }
              ]
              CONFIG
                echo "densenet_onnx downloaded and configured."
              fi
              # Remove lost+found if present (confuses Triton model scanner)
              rm -rf /models/lost+found
              echo "Model repository ready."
              ls -la /models/
          volumeMounts:
            - name: model-repo
              mountPath: /models
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:26.03-py3
          imagePullPolicy: IfNotPresent
          args:
            - tritonserver
            - --model-repository=/models
            - --log-verbose=0
            - --exit-on-error=false
            - --strict-readiness=false
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 8002
              protocol: TCP
          resources:
            limits:
              nvidia.com/mig-2g.48gb: 1
            requests:
              nvidia.com/mig-2g.48gb: 1
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: model-repo
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-repo
          persistentVolumeClaim:
            claimName: triton-model-repo
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: triton-inference-server
  labels:
    app: triton-inference-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8001
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 8002
      targetPort: metrics
      protocol: TCP
  selector:
    app: triton-inference-server
